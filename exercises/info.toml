format_version = 1

welcome_message = """
Is this your first time? Don't worry, TypeScriptlings is made for beginners!
We are going to teach you a lot of things about TypeScript, but before we can
get started, here are some notes about how TypeScriptlings operates:

1. The central concept behind TypeScriptlings is that you solve exercises. These
   exercises usually contain some compiler or logic errors which cause the
   exercise to fail typechecking or testing. It's your job to find all errors
   and fix them!
2. Make sure to have your editor open in the `typescriptlings/` directory.
   TypeScriptlings will show you the path of the current exercise under the
   progress bar. Open the exercise file in your editor, fix errors and save
   the file. TypeScriptlings will automatically detect the file change and
   rerun the exercise. If all errors are fixed, TypeScriptlings will ask you
   to move on to the next exercise.
3. If you're stuck on an exercise, enter `h` to show a hint.
"""

final_message = """
We hope you enjoyed learning about the various aspects of TypeScript!
If you noticed any issues, don't hesitate to report them.
"""

# INTRO

[[exercises]]
name = "intro1"
dir = "00_intro"
test = false
skip_check_unsolved = true
hint = """
Enter `n` to move on to the next exercise.
You might need to press ENTER after typing `n`."""

[[exercises]]
name = "intro2"
dir = "00_intro"
test = false
hint = """
The function name in `main` is misspelled.
TypeScript will suggest the correct name (`console.log`)."""

# VARIABLES

[[exercises]]
name = "variables1"
dir = "01_variables"
test = false
hint = """
The declaration in `main` is missing a keyword that is needed
to create a new variable binding (`let` or `const`)."""

[[exercises]]
name = "variables2"
dir = "01_variables"
test = false
hint = """
`const` bindings cannot be reassigned. There is a keyword
for bindings that CAN be reassigned."""

[[exercises]]
name = "variables3"
dir = "01_variables"
test = false
hint = """
A variable declared with a type but no value cannot be used yet.
Give `x` a value of type `number`."""

# FUNCTIONS

[[exercises]]
name = "functions1"
dir = "02_functions"
test = false
hint = """
`main` calls a function named `callMe` that does not exist yet.
Define it above `main`: no parameters, no return value."""

[[exercises]]
name = "functions2"
dir = "02_functions"
test = false
hint = """
Under `strict` mode every parameter needs a type annotation.
What type is `num`? Look at how `square` is called."""

[[exercises]]
name = "functions3"
dir = "02_functions"
test = false
hint = """
The declared return type is `boolean`, but the function body
returns nothing. Add the `return` keyword before the expression."""

# IF

[[exercises]]
name = "if1"
dir = "03_if"
test = false
hint = """
`bigger` promises to return a `number`. Both branches must keep
that promise — return `b` instead of a string."""

# PRIMITIVE TYPES

[[exercises]]
name = "primitive_types1"
dir = "04_primitive_types"
test = false
hint = """
`"5" + 3` is `"53"` (string concatenation), not `8`.
Declare `x` as a `number` instead of a `string`."""

[[exercises]]
name = "primitive_types2"
dir = "04_primitive_types"
test = false
hint = """
The tuple is `[string, number]`: index 0 is the name, index 1
is the age. The annotations are swapped."""

# ARRAYS

[[exercises]]
name = "arrays1"
dir = "05_arrays"
test = false
hint = """
`scores` is a `number[]`. Push the number `30`
instead of the string `"thirty"`."""
